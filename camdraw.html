<body>
  <div id="map"></div>
  <canvas id="overlay"></canvas>

  <!-- ADD THIS HIDDEN VIDEO ELEMENT HERE -->
  <video id="webcamVideo" autoplay playsinline style="display:none;"></video>

  <div class="controls">
    <h3 style="margin:0 0 5px 0; font-size: 18px;">DrawonMaps</h3>
    <p style="margin:0 0 10px 0; font-size: 12px; color: #666;">County Rasterizer</p>
    
    <!-- CHANGE THIS ID TO startLive -->
    <button id="startLive">Use Webcam</button>
    
    <button id="apply">Apply to Counties</button>

    <div class="instructions">
      • <b>Drag image</b> to position<br>
      • <b>Scroll</b> to resize image<br>
      • <b>Drag map</b> (outside image) to pan
    </div>
  </div>

  <!-- Ensure this filename matches your actual JS file (camapp.js or app.js) -->
  <script src="camapp.js"></script>
</body>
