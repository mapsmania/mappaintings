<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Map Painting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
    
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    /* The canvas sits on top of the map */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      /* We handle pointer-events in JS to allow map panning */
    }

    /* Modern UI Container */
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(5px);
      width: 220px;
    }

    /* Styling the buttons and custom file label */
    button, .file-upload-label {
      appearance: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      display: block;
    }

    #apply {
      background-color: #007AFF;
      color: white;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
    }

    #apply:hover {
      background-color: #0063d1;
      transform: translateY(-1px);
    }

    .file-upload-label {
      background-color: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }

    #upload { display: none; }

    .instructions {
      font-size: 11px;
      color: #666;
      line-height: 1.6;
      margin-top: 5px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="overlay"></canvas>

  <div class="controls">
    <h3 style="margin:0 0 5px 0; font-size: 18px;">DrawonMaps</h3>
    <p style="margin:0 0 10px 0; font-size: 12px; color: #666;">County Rasterizer</p>
    
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <button id="startLive">Start Live Cam</button>
    
    <button id="apply">Apply to Counties</button>

    <div class="instructions">
      • <b>Drag image</b> to position<br>
      • <b>Scroll</b> to resize image<br>
      • <b>Drag map</b> (outside image) to pan
    </div>
  </div>

  <script src="camapp.js"></script>
</body>
</html>
